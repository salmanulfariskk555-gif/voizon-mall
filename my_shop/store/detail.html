{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | Z Pharmaka</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <div class="max-w-5xl mx-auto px-6 py-20">
        <a href="{% url 'index' %}" class="text-sm font-bold text-emerald-600 mb-10 inline-block">← Back to Shop</a>

        <div class="grid md:grid-cols-2 gap-12 bg-white p-10 rounded-[40px] shadow-sm border border-slate-100">
            <div class="bg-slate-50 rounded-3xl p-10 flex items-center justify-center">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="max-h-[400px] object-contain">
                {% else %}
                    <img src="https://via.placeholder.com/400" alt="No Image">
                {% endif %}
            </div>

            <div class="space-y-6">
                <h1 class="text-4xl font-black text-slate-900 uppercase">{{ product.name }}</h1>
                <p class="text-2xl font-bold text-emerald-600">₹{{ product.price }}</p>

                <div class="border-t border-b border-slate-100 py-6">
                    <h3 class="font-bold text-slate-800 mb-2">Description</h3>
                    <p class="text-slate-600 leading-relaxed">{{ product.description }}</p>
                </div>

                <button
                    <!-- Pazhaya button maatti ithu kodukkuka -->
<a href="{% url 'add_to_cart' product.id %}" class="btn btn-add">
    <i class="fas fa-shopping-cart"></i> ADD TO CART
</a>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
