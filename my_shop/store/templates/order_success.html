{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | VOIZON MALL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; }
        .success-checkmark {
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-50">

    <div class="max-w-md w-full bg-white p-10 rounded-[3rem] shadow-2xl text-center">
        <div class="success-checkmark w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-8">
            <i class="fa-solid fa-check text-4xl"></i>
        </div>

        <h1 class="text-3xl font-black text-slate-900 mb-4 tracking-tight">Order Confirmed!</h1>
        <p class="text-slate-500 mb-8 leading-relaxed font-medium">
            Thank you for shopping at **VOIZON MALL**. Your order has been placed successfully and we are preparing it for shipment.
        </p>

        <div class="bg-slate-50 p-6 rounded-2xl mb-8 border border-slate-100">
            <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-slate-400 mb-1">Status</p>
            <p class="text-emerald-600 font-black">Processing for Delivery</p>
        </div>

        <div class="space-y-4">
            <a href="{% url 'index' %}" class="block w-full bg-black text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transition-all shadow-lg">
                Continue Shopping
            </a>
            <a href="{% url 'my_orders' %}" class="block w-full text-slate-400 font-bold text-sm hover:text-blue-600 transition-all uppercase tracking-widest">
                View My Orders
            </a>
        </div>
    </div>

</body>
</html>
