<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOIZON | Exclusive Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #050505; /* Deep Black */
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* പശ്ചാത്തലത്തിലെ ആധുനികമായ വെളിച്ചം (Glow Effect) */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        /* പ്രീമിയം ലോഗിൻ കാർഡ് */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 60px 45px;
            border-radius: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 16px 20px;
            border-radius: 14px;
            width: 100%;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #2563eb;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.2);
            outline: none;
        }

        .btn-premium {
            background: #ffffff;
            color: #000;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-premium:hover {
            background: #e5e5e5;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        .brand-text {
            letter-spacing: 4px;
            font-weight: 200;
            margin-bottom: 40px;
        }

        .brand-text b {
            font-weight: 800;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="login-card">
        <div class="brand-text text-2xl">
            VOIZON<b>MALL</b>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="space-y-2">
                <input type="text" name="username" placeholder="Identifier" class="input-field" required>
                <input type="password" name="password" placeholder="Password" class="input-field" required>
            </div>

            <button type="submit" class="btn-premium">
                ENTER PLATFORM
            </button>
        </form>

        <div class="mt-10 flex justify-between items-center px-2">
            <a href="{% url 'signup' %}" class="text-gray-500 text-xs hover:text-white transition-all uppercase tracking-widest font-bold">Register</a>
            <span class="text-gray-700">|</span>
            <a href="#" class="text-gray-500 text-xs hover:text-white transition-all uppercase tracking-widest font-bold">Help Desk</a>
        </div>
    </div>

</body>
</html>
